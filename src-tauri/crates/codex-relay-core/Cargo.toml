[package]
name = "codex-relay-core"
version = "0.4.0"
description = "Platform-independent Codex Relay provider and configuration logic"
authors = ["Codex Relay contributors"]
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
toml_edit = "0.25.13"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-no-provider",
    "system-proxy",
] }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tempfile = "3.27.0"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
regex = "1.12.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
serial_test = "3.5.0"
