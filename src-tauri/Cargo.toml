[workspace]
members = [
    "crates/codex-relay-core",
    "../tools/release-console/src-tauri",
]
resolver = "3"

[package]
name = "codex-relay"
version = "0.5.1"
description = "Safely manage local Codex model providers"
authors = ["Codex Relay contributors"]
edition = "2024"

[lib]
name = "codex_relay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
codex-relay-core = { path = "crates/codex-relay-core" }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "time"] }
chrono = { version = "0.4.45", features = ["serde"] }
notify = "8.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
