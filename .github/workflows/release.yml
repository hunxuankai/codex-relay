name: 发布 Windows 更新

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: 安装前端依赖
        run: npm ci

      - name: 运行完整检查
        run: npm run check

      - name: 构建 Draft Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.updater.conf.json
          tagName: v__VERSION__
          releaseName: Codex Relay v__VERSION__
          releaseBody: |
            ## 更新内容

            - 支持在 Provider 列表中拖动调整 Provider 顺序，并把顺序保存在 Codex Relay 私有偏好中；不会向 Codex 官方配置写入私有排序字段。
            - 主界面标题会显示当前版本；重测 API 时会刷新并自动打开本次请求与响应详情，测试进行中和完成后的状态更清晰。
            - 为支持的模型增加按 Provider 保存的 Fast 开关；启用后会安全同步 Codex 的 Fast 服务层配置，界面同时提示可能增加的用量或费用。

            ## 更新方式

            已安装 `v0.2.1` 的用户可在设置页点击“检查更新”，再选择“下载并安装”；也可从 GitHub Releases 手动下载安装器，从 `v0.2.1` 更新到 `v0.3.0`。下载会经过 Tauri updater 签名校验，安装阶段应用会退出，并可能请求 Windows 管理员权限。

            ## 注意事项

            本版本未使用 Windows Authenticode，Windows 可能显示“未知发布者”。安装和升级不会删除 Codex 配置、Codex Relay 应用数据、日志或备份。
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
