name: 发布 Windows 更新

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: 安装前端依赖
        run: npm ci

      - name: 运行完整检查
        run: npm run check

      - name: 构建 Draft Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.updater.conf.json
          tagName: v__VERSION__
          releaseName: Codex Relay v__VERSION__
          releaseBody: |
            ## 更新内容

            - Provider 支持多命名 Base URL 与多命名 API Key，并可分别保存模型与推理强度偏好。
            - 新增 Provider API 可用性与 Codex 兼容性测试，可选择应用代理，并在脱敏后查看实际请求与响应详情。
            - 新增应用网络代理、本机代理检测、启动与周期更新提醒；同时统一界面交互与主题，优化 Provider 布局、自检提示、通知和备份文件查看。
            - 修复旧版备份元数据兼容问题，并确保已登记的 NSIS 升级继续沿用原安装目录。

            ## 更新方式

            已安装 `v0.1.2` 的用户可在设置页点击“检查更新”，再选择“下载并安装”；也可从 GitHub Releases 手动下载安装器，从 `v0.1.2` 更新到 `v0.2.0`。下载会经过 Tauri updater 签名校验，安装阶段应用会退出，并可能请求 Windows 管理员权限。

            ## 注意事项

            本版本未使用 Windows Authenticode，Windows 可能显示“未知发布者”。安装和升级不会删除 Codex 配置、Codex Relay 应用数据、日志或备份。
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
